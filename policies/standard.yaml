standard_version: '0.1'
commandments:
  M1:
    required: true
    description: Individual, precise, and verifiable instructions.
  M2:
    required: true
    description: Justified and authorized technology choices.
  M3:
    required: true
    description: Meaningful tests, edge cases, integration, regression, and security where applicable.
  M4:
    required: true
    description: Accurate, usable, and up-to-date documentation.
  M5:
    required: true
    description: Readable, modular, maintainable code with appropriate efficiency.
